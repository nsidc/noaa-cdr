name: Update sea ice concentration GeoParquet

on:
  schedule:
    # Daily job: runs every day at 13:17 UTC
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to ingest"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - monthly
          - both

permissions:
  contents: write

jobs:
  update-geoparquet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and pipeline dependencies
        run: |
          pip install -e .
          pip install -r scripts/update_geoparquet/requirements.txt

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date +%d)" = "07" ]; then
            echo "mode=both" >> "$GITHUB_OUTPUT"
          else
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ingestion
        id: ingest
        run: |
          python scripts/update_geoparquet/ingest.py \
            --mode ${{ steps.mode.outputs.mode }} \
            | tee ingest_output.txt
          echo "daily_added=$(grep -o 'daily_added=[0-9]*' ingest_output.txt | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "monthly_added=$(grep -o 'monthly_added=[0-9]*' ingest_output.txt | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Regenerate catalog JSON
        if: steps.ingest.outputs.daily_added != '0' || steps.ingest.outputs.monthly_added != '0'
        run: python scripts/update_geoparquet/generate_catalog.py

      - name: Commit updated files
        if: steps.ingest.outputs.daily_added != '0' || steps.ingest.outputs.monthly_added != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stac/
          git commit -m "Add ${{ steps.ingest.outputs.daily_added }} daily and ${{ steps.ingest.outputs.monthly_added }} monthly sea ice item(s)"
          git push

      - name: Trigger Jenkins sync
        if: steps.ingest.outputs.daily_added != '0' || steps.ingest.outputs.monthly_added != '0'
        run: |
          curl -X POST \
            "https://ci.jenkins-ops.apps.int.nsidc.org/job/NOAA-sea-ice-cdr-stac/build?token=${{ secrets.JENKINS_TOKEN }}"
